<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Ahmed Elesawy</title>
  <desc id="d">Software Development Engineer. Full-Stack .NET and Angular, DevOps, AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
    .k { fill: #a78bfa; } .ty { fill: #22d3ee; } .s { fill: #86efac; } .p { fill: #e2e8f0; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .drift { animation: drift 14s ease-in-out infinite alternate; }
    .drift2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
    .line { white-space: pre; animation: rise .6s ease-out both; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes drift { to { transform: translate(40px, 18px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="drift" cx="170" cy="40" r="260" fill="url(#glowA)"/>
    <circle class="drift2" cx="1080" cy="300" r="280" fill="url(#glowB)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#1f2937"/>

  <!-- Intro -->
  <text x="64" y="96" class="mono" font-size="16" fill="#22d3ee">&gt; hello, world. I'm</text>
  <rect class="cursor" x="252" y="82" width="9" height="18" fill="#22d3ee"/>
  <text x="62" y="162" class="sans" font-size="60" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Ahmed Elesawy</text>
  <text x="64" y="204" class="sans" font-size="24" font-weight="600" fill="#f1f5f9">Software Development Engineer</text>
  <text x="64" y="238" class="sans" font-size="18" fill="#94a3b8">Full-Stack .NET &amp; Angular · DevOps · AI</text>
  <text x="64" y="274" class="mono" font-size="14" fill="#64748b">@ Alqemam-qTech · Egypt</text>

  <!-- Code card -->
  <rect x="688" y="56" width="456" height="208" rx="14" fill="#0d1117" fill-opacity=".88" stroke="#30363d"/>
  <circle cx="712" cy="78" r="5.5" fill="#ff5f57"/>
  <circle cx="731" cy="78" r="5.5" fill="#febc2e"/>
  <circle cx="750" cy="78" r="5.5" fill="#28c840"/>
  <text x="776" y="83" class="mono" font-size="13" fill="#64748b">Engineer.cs</text>
  <line x1="688" y1="98" x2="1144" y2="98" stroke="#30363d"/>
  <g class="mono" font-size="15" xml:space="preserve">
    <text x="712" y="126" class="line p" style="animation-delay:.1s"><tspan class="k">var</tspan> ahmed = <tspan class="k">new</tspan> <tspan class="ty">Engineer</tspan></text>
    <text x="712" y="150" class="line p" style="animation-delay:.25s">{</text>
    <text x="712" y="174" class="line p" style="animation-delay:.4s">    Stack    = [<tspan class="s">".NET"</tspan>, <tspan class="s">"Angular"</tspan>, <tspan class="s">"SQL"</tspan>],</text>
    <text x="712" y="198" class="line p" style="animation-delay:.55s">    Ships    = [<tspan class="s">"APIs"</tspan>, <tspan class="s">"Sync"</tspan>, <tspan class="s">"CI/CD"</tspan>],</text>
    <text x="712" y="222" class="line p" style="animation-delay:.7s">    Explores = [<tspan class="s">"AI"</tspan>, <tspan class="s">"LLM agents"</tspan>],</text>
    <text x="712" y="246" class="line p" style="animation-delay:.85s">};</text>
  </g>
</svg>
